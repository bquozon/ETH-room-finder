<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Wi-Fi room test</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--ink:#14171c;--mute:#5d6470;--line:#d9dde3;--accent:#1f407a}
@media (prefers-color-scheme:dark){:root{--bg:#111418;--card:#1a1e24;--ink:#eef1f5;--mute:#9aa3ad;--line:#2c323a;--accent:#7ea3e6}}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,sans-serif}
main{max-width:760px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:22px;margin:0 0 4px} p{color:var(--mute);margin:0 0 14px}
.box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:0 0 14px}
.row{display:flex;gap:8px;flex-wrap:wrap}
input{flex:1;min-width:140px;font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
button{font:inherit;font-weight:600;padding:8px 14px;border-radius:8px;border:0;background:var(--accent);color:#fff;cursor:pointer}
button.ghost{background:none;color:var(--ink);border:1px solid var(--line)}
pre{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px}
table{width:100%;border-collapse:collapse;font-size:13px} td,th{text-align:left;padding:5px 6px;border-top:1px solid var(--line);overflow-wrap:anywhere}
#guess{font-weight:600}
</style>
</head>
<body>
<main>
  <h1>Wi-Fi room test</h1>
  <p>Records what this browser can see of the network in each room, then checks whether it is enough to tell rooms apart. Samples stay in this browser.</p>

  <div class="box"><pre id="now">Probing…</pre></div>

  <div class="box">
    <div class="row">
      <input id="room" placeholder="Room you are in, e.g. HG E 41" autocomplete="off">
      <button id="save">Save sample</button>
      <button id="again" class="ghost">Probe again</button>
    </div>
    <p id="guess" style="margin:10px 0 0"></p>
  </div>

  <div class="box">
    <div class="row" style="justify-content:space-between;align-items:center">
      <b>Samples</b>
      <span class="row"><button id="export" class="ghost">Copy JSON</button><button id="clear" class="ghost">Clear</button></span>
    </div>
    <table><thead><tr><th>Time</th><th>Room</th><th>Public IP</th><th>Local candidates</th></tr></thead><tbody id="rows"></tbody></table>
  </div>
</main>
<script src="wifi-test.js"></script>
</body>
</html>
